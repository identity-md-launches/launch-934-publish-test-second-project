<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>second project</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light;
      --color-background: #fff;
      --color-text: #171717;
      --color-link: #0645ad;
      --color-visited: #551a8b;
      --space-small: 0.5rem;
      --space-page: 1.5rem;
      font: 400 100%/1.5 system-ui, sans-serif;
      color: var(--color-text);
      background: var(--color-background);
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: var(--space-page); }
    main { max-inline-size: 65ch; }
    h1 { margin: 0; font-size: 1.5rem; line-height: 1.3; font-weight: 600; }
    ul { margin-block: var(--space-page) 0; padding-inline-start: var(--space-page); }
    li + li { margin-block-start: var(--space-small); }
    a {
      display: inline-block;
      max-inline-size: 100%;
      min-inline-size: 44px;
      min-block-size: 44px;
      padding-block: 0.625rem;
      overflow-wrap: anywhere;
      color: var(--color-link);
      text-underline-offset: 0.15em;
    }
    a:visited { color: var(--color-visited); }
  </style>
</head>
<body>
  <main>
    <h1>second project</h1>
  </main>
</body>
</html>
